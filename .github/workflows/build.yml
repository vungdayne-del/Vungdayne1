
name: Vung Facebook AI Auto - Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare Source Code
    runs-on: ubuntu-latest

    outputs:
      project_dir: ${{ steps.locate.outputs.project_dir }}
      android_dir: ${{ steps.locate.outputs.android_dir }}
      backend_dir: ${{ steps.locate.outputs.backend_dir }}
      has_backend: ${{ steps.locate.outputs.has_backend }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract uploaded ZIP if needed
        shell: bash
        run: |
          set -e

          if [ -f "android/app/build.gradle.kts" ] || \
             [ -f "android/app/build.gradle" ]; then
            echo "Source already exists at repository root."
            exit 0
          fi

          ZIP_FILE=$(find . -maxdepth 2 -type f \
            -iname "*.zip" \
            ! -path "./.git/*" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No Android project or source ZIP found."
            echo "Upload the extracted source or the project ZIP."
            exit 1
          fi

          echo "Extracting: $ZIP_FILE"
          mkdir -p _extracted_source
          unzip -oq "$ZIP_FILE" -d _extracted_source

      - name: Locate project directories
        id: locate
        shell: bash
        run: |
          set -e

          ANDROID_BUILD=$(find . -type f \
            \( -path "*/android/app/build.gradle.kts" \
            -o -path "*/android/app/build.gradle" \) \
            ! -path "*/.git/*" \
            ! -path "*/.gradle/*" | head -n 1)

          if [ -z "$ANDROID_BUILD" ]; then
            echo "ERROR: Android Gradle project not found."
            find . -maxdepth 5 -type f \
              \( -name "build.gradle" \
              -o -name "build.gradle.kts" \
              -o -name "settings.gradle.kts" \)
            exit 1
          fi

          ANDROID_DIR="${ANDROID_BUILD%/app/build.gradle*}"

          if [ ! -f "$ANDROID_DIR/settings.gradle.kts" ] && \
             [ ! -f "$ANDROID_DIR/settings.gradle" ]; then
            echo "ERROR: Android settings.gradle not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$ANDROID_DIR")
          BACKEND_DIR="$PROJECT_DIR/backend"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "android_dir=$ANDROID_DIR" >> "$GITHUB_OUTPUT"

          if [ -f "$BACKEND_DIR/package.json" ]; then
            echo "backend_dir=$BACKEND_DIR" >> "$GITHUB_OUTPUT"
            echo "has_backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
            echo "has_backend=false" >> "$GITHUB_OUTPUT"
            echo "Backend directory not found; backend tests will be skipped."
          fi

          echo "Project: $PROJECT_DIR"
          echo "Android: $ANDROID_DIR"
          echo "Backend: $BACKEND_DIR"

  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    needs: prepare

    if: needs.prepare.outputs.has_backend == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract source if uploaded as ZIP
        shell: bash
        run: |
          if [ ! -f "${{ needs.prepare.outputs.backend_dir }}/package.json" ]; then
            ZIP_FILE=$(find . -maxdepth 2 -type f \
              -iname "*.zip" | head -n 1)

            if [ -n "$ZIP_FILE" ]; then
              mkdir -p _extracted_source
              unzip -oq "$ZIP_FILE" -d _extracted_source
            fi
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install backend dependencies
        working-directory: ${{ needs.prepare.outputs.backend_dir }}
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run backend tests
        working-directory: ${{ needs.prepare.outputs.backend_dir }}
        run: npm test

      - name: Compile backend TypeScript
        working-directory: ${{ needs.prepare.outputs.backend_dir }}
        run: npm run build

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: prepare

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract source if uploaded as ZIP
        shell: bash
        run: |
          if [ ! -f "${{ needs.prepare.outputs.android_dir }}/app/build.gradle.kts" ] && \
             [ ! -f "${{ needs.prepare.outputs.android_dir }}/app/build.gradle" ]; then
            ZIP_FILE=$(find . -maxdepth 2 -type f \
              -iname "*.zip" | head -n 1)

            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: Source ZIP not found."
              exit 1
            fi

            mkdir -p _extracted_source
            unzip -oq "$ZIP_FILE" -d _extracted_source
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK manager
        id: sdk
        shell: bash
        run: |
          set -e

          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"

          if [ ! -d "$SDK" ]; then
            SDK="${ANDROID_SDK_ROOT:-/usr/local/share/android-sdk}"
          fi

          SDKMANAGER=$(find "$SDK/cmdline-tools" \
            -type f -name sdkmanager 2>/dev/null | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: Android SDK command-line tools not found."
            echo "SDK path checked: $SDK"
            exit 1
          fi

          echo "sdk=$SDK" >> "$GITHUB_OUTPUT"
          echo "sdkmanager=$SDKMANAGER" >> "$GITHUB_OUTPUT"

          echo "Found SDK: $SDK"
          echo "Found sdkmanager: $SDKMANAGER"

      - name: Install Android SDK packages
        env:
          SDK_PATH: ${{ steps.sdk.outputs.sdk }}
          SDKMANAGER: ${{ steps.sdk.outputs.sdkmanager }}
        shell: bash
        run: |
          set -e

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Validate Android project
        working-directory: ${{ needs.prepare.outputs.android_dir }}
        run: |
          set -e

          test -f settings.gradle.kts || test -f settings.gradle
          test -f app/build.gradle.kts || test -f app/build.gradle

          echo "Android project files found."
          echo "Gradle version:"
          gradle --version

      - name: Build Debug APK
        working-directory: ${{ needs.prepare.outputs.android_dir }}
        env:
          ANDROID_HOME: ${{ steps.sdk.outputs.sdk }}
          ANDROID_SDK_ROOT: ${{ steps.sdk.outputs.sdk }}
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Verify APK exists
        id: verify
        shell: bash
        env:
          ANDROID_DIR: ${{ needs.prepare.outputs.android_dir }}
        run: |
          set -e

          APK="$ANDROID_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            find "$ANDROID_DIR/app/build/outputs" \
              -type f 2>/dev/null || true
            exit 1
          fi

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"
          ls -lh "$APK"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vung-Facebook-AI-Auto-APK
          path: ${{ needs.prepare.outputs.android_dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
