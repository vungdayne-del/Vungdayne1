
name: Vung Facebook AI Auto - Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  prepare:
    name: Locate Source Code
    runs-on: ubuntu-latest

    outputs:
      android_dir: ${{ steps.locate.outputs.android_dir }}
      backend_dir: ${{ steps.locate.outputs.backend_dir }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract source ZIP if needed
        shell: bash
        run: |
          set -e
          if find . -type f \( \
            -path "*/app/build.gradle.kts" -o \
            -path "*/app/build.gradle" \
          \) -not -path "*/.git/*" | grep -q .; then
            echo "Android Gradle project found."
          else
            ZIP_FILE=$(find . -maxdepth 3 -type f \
              -iname "*.zip" | head -n 1)

            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: Android project or source ZIP not found."
              exit 1
            fi

            mkdir -p _source
            unzip -oq "$ZIP_FILE" -d _source
          fi

      - name: Find Android and backend directories
        id: locate
        shell: bash
        run: |
          set -e

          BUILD_FILE=$(find . -type f \( \
            -path "*/app/build.gradle.kts" -o \
            -path "*/app/build.gradle" \
          \) -not -path "*/.git/*" \
            -not -path "*/.gradle/*" | head -n 1)

          if [ -z "$BUILD_FILE" ]; then
            echo "ERROR: app/build.gradle(.kts) not found."
            exit 1
          fi

          APP_DIR="${BUILD_FILE%/build.gradle*}"
          ANDROID_DIR="${APP_DIR%/app}"
          echo "android_dir=$ANDROID_DIR" >> "$GITHUB_OUTPUT"

          BACKEND_FILE=$(find . -type f \
            -path "*/backend/package.json" \
            -not -path "*/node_modules/*" \
            -not -path "*/.git/*" | head -n 1)

          if [ -n "$BACKEND_FILE" ]; then
            echo "backend_dir=${BACKEND_FILE%/package.json}" >> "$GITHUB_OUTPUT"
          else
            echo "backend_dir=" >> "$GITHUB_OUTPUT"
            echo "Backend not found; backend tests will be skipped."
          fi

  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    needs: prepare

    if: needs.prepare.outputs.backend_dir != ''

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: ${{ needs.prepare.outputs.backend_dir }}
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run tests
        working-directory: ${{ needs.prepare.outputs.backend_dir }}
        run: npm test --if-present

      - name: Build backend
        working-directory: ${{ needs.prepare.outputs.backend_dir }}
        run: npm run build --if-present

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: prepare

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Check Android project
        working-directory: ${{ needs.prepare.outputs.android_dir }}
        run: |
          test -f settings.gradle.kts || test -f settings.gradle
          test -f app/build.gradle.kts || test -f app/build.gradle
          gradle --version

      - name: Build Debug APK
        working-directory: ${{ needs.prepare.outputs.android_dir }}
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Vung-Facebook-AI-Auto-APK
          path: ${{ needs.prepare.outputs.android_dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
